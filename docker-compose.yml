# Local development database. Production uses Neon (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16-alpine
    container_name: acme-salary-db
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme_salary
    ports:
      # A non-default host port avoids clashing with other local PostgreSQL instances.
      - '${ACME_DB_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme -d acme_salary']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
